[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esi-revision-calendar"
version = "0.1.0"
description = "Generated iCalendar revision plan for an ESI 2CP student"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "icalendar>=6.1,<7",
  "python-dateutil>=2.9,<3",
]

[project.scripts]
esi-revision-calendar = "esi_revision_calendar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
