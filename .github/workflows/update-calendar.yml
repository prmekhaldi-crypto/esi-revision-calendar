name: Update revision calendar

on:
  workflow_dispatch:
  schedule:
    # UTC; the generated event times remain Africa/Algiers.
    - cron: "17 2,14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install .
      - name: Regenerate and validate feed
        run: >-
          python -m esi_revision_calendar.cli
          --output public/revision-calendar.ics
          --horizon-days 42
          --keep-previous
      - name: Add Pages metadata
        run: touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
